<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3 justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <span class="navbar-brand mb-0 h1">Módulo de Clases</span>
            <!-- Enlace para volver a la lista de usuarios -->
            <a th:href="@{/usuarios}" class="btn btn-outline-light btn-sm">← Volver a Usuarios</a>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

<div class="container mt-4">
    <div th:if="${param.mensaje}" class="alert alert-success" th:text="${param.mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Clases Programadas (Crossfit, Yoga, Zumba)</h4>
        <!-- Solo el ENTRENADOR puede crear nuevas clases -->
        <a sec:authorize="hasRole('ENTRENADOR')" th:href="@{/clases/nueva}" class="btn btn-primary">+ Nueva Clase</a>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tipo de Clase</th>
                <th>Entrenador Encargado</th>
                <th>Inicio</th>
                <th>Fin (1 hora)</th>
                <th>Cupo Máximo</th>
                <th sec:authorize="hasRole('ENTRENADOR')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clases}">
                <td th:text="${c.id}"></td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${c.tipo}"></span>
                </td>
                <td th:text="${c.entrenador != null ? c.entrenador.nombre : 'Sin asignar'}"></td>
                <td th:text="${#temporals.format(c.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(c.fechaHoraFin, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${c.cupoMaximo} + ' personas'"></span>
                </td>
                <td sec:authorize="hasRole('ENTRENADOR')">
                    <form th:action="@{/clases/{id}/eliminar(id=${c.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Desea eliminar esta clase?');">
                        <button class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clases)}">
                <td colspan="7" class="text-center text-muted">No hay clases programadas en este momento</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
