<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4">Detalle del Usuario</h3>
            
            <ul class="list-group list-group-flush mb-4">
                <li class="list-group-item"><b>ID:</b> <span th:text="${usuario.id}"></span></li>
                <li class="list-group-item"><b>Nombre:</b> <span th:text="${usuario.nombre}"></span></li>
                <li class="list-group-item"><b>Username:</b> <span th:text="${usuario.username}"></span></li>
                <li class="list-group-item"><b>Email:</b> <span th:text="${usuario.email}"></span></li>
                <li class="list-group-item"><b>Teléfono:</b> <span th:text="${usuario.telefono}"></span></li>
                <li class="list-group-item">
                    <b>Estado:</b> 
                    <span class="badge" th:classappend="${usuario.activo} ? 'bg-success' : 'bg-secondary'"
                          th:text="${usuario.activo} ? 'Activo' : 'Inactivo'"></span>
                </li>
                <li class="list-group-item">
                    <b>Rol:</b> 
                    <span class="badge" th:classappend="${usuario.rol =='ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${usuario.rol}"></span>
                </li>
            </ul>

            <div class="d-flex justify-content-between">
                <a th:href="@{/usuarios}" class="btn btn-secondary">Volver a la lista</a>
                <!-- El botón Editar solo aparece para ADMIN (Punto 3 del Ejercicio 5) -->
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
