<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Clientes y Entrenadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <nav class="navbar navbar-dark bg-dark px-3 justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <span class="navbar-brand mb-0 h1">Gestión de Clientes y Entrenadores</span>
            <!-- Enlace rápido a Clases -->
            <a th:href="@{/clases}" class="btn btn-outline-light btn-sm">Ver Clases 🏋️‍♂️</a>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

<div class="container mt-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Lista de usuarios del gimnasio</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <a sec:authorize="hasRole('ENTRENADOR')" th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <!-- BUSCADOR -->
    <form method="get" th:action="@{/usuarios}" class="input-group mb-3">
        <input type="text" name="q" class="form-control" placeholder="Buscar por nombre o username..." th:value="${q}">
        <button class="btn btn-outline-primary" type="submit">Buscar</button>
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Limpiar</a>
    </form>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Username</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Estado</th>
                <th>Rol</th>
                <th sec:authorize="hasRole('ENTRENADOR')">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td><a th:href="@{/usuarios/{id}(id=${u.id})}" th:text="${u.nombre}"></a></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.telefono}"></td>
                <td>
                    <span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-secondary'"
                          th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td>
                    <span class="badge" th:classappend="${u.rol == 'ENTRENADOR'} ? 'bg-danger' : 'bg-primary'"
                          th:text="${u.rol}"></span>
                </td>
                <td sec:authorize="hasRole('ENTRENADOR')">
                    <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline"
                    onsubmit="return confirm('Desea eliminar este usuario?');">
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="8" class="text-center text-muted">No hay usuarios registrados en el sistema</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
