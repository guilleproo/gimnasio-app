<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3 text-center">Recuperar Contraseña</h3>
            <p class="text-muted text-small text-center">Ingresa tu usuario y telefono registrado para establecer una nueva contrasena.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

            <form th:action="@{/recuperar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Tu nombre de usuario">
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefono</label>
                    <input type="text" name="telefono" class="form-control" required placeholder="Tu numero de telefono">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nuevo Password</label>
                    <input type="password" name="nuevaPassword" class="form-control" required placeholder="Escribe tu nueva contrasena">
                </div>

                <button type="submit" class="btn btn-primary w-100">Cambiar Password</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none">← Volver al Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
