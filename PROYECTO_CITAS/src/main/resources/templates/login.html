<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 400px; margin-top: 10vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-4 text-center">Iniciar sesión</h3>

            <!-- Aqui se incluye cuenta inactiva -->
            <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos, o cuenta inactiva</div>
            <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada</div>

            <!-- Spring Security procesa este POST automáticamente -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>

                <div class="text-center mt-2">
                    <a th:href="@{/recuperar}" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

            <p class="text-muted small mt-3 mb-0">Prueba: <b>admin / admin123</b> o <b>maria / maria123</b></p>
        </div>
    </div>
</div>
</body>
</html>
